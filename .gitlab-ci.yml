stages:
  - test
  - build

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}

test:
  stage: test
  image: docker.io/hexpm/elixir:1.18.2-erlang-26.2.5.7-alpine-3.21.2
  services:
    - postgres:14-alpine
  variables:
    MIX_ENV: test
    DATABASE_URL: postgresql://postgres:postgres@postgres/asciinema_test
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: asciinema_test
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  before_script:
    - apk add --no-cache nodejs npm rust cargo build-base git
    - mix local.rebar --force
    - mix local.hex --force
    - mix deps.get
    - cd native && cargo build -r && cd ..
    - cd assets && npm install && cd ..
    - mix assets.setup
    - mix assets.build
    - mix ecto.create
    - mix ecto.migrate
  script:
    - mix test --include vt
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "terminal-tivo"
    - if: $CI_COMMIT_BRANCH == "cast-url-prealloc"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      # Determine image tag
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="$CI_COMMIT_REF_SLUG"
      fi
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE_NAME}:${TAG}" \
        --destination "${IMAGE_NAME}:latest" \
        --cache=true \
        --cache-repo="${IMAGE_NAME}/cache"
  rules:
    - if: $CI_COMMIT_TAG =~ /^dvr-/
    - if: $CI_COMMIT_TAG =~ /^cast-url-/
    - if: $CI_COMMIT_BRANCH == "terminal-tivo"
    - if: $CI_COMMIT_BRANCH == "cast-url-prealloc"
    - if: $CI_COMMIT_BRANCH == "develop"
